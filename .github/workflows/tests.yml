name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instala dependências
        run: python -m pip install -e . pytest
      - name: Roda a suíte (sem rede — tudo via fakes injetáveis)
        run: python -m pytest -q
